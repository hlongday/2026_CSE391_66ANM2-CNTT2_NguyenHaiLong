<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Đăng Ký Nâng Cao</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 40px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 420px; }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 18px; position: relative; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #555; }
        
        input[type="text"], input[type="email"], input[type="password"] { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.2); }

        /* Đếm ký tự */
        .char-count { text-align: right; font-size: 11px; color: #888; margin-top: 2px; }

        /* Password Strength */
        .password-wrapper { position: relative; }
        .toggle-password { 
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%); 
            cursor: pointer; color: #666; user-select: none; 
        }
        .strength-meter { height: 4px; width: 100%; background: #eee; margin-top: 8px; border-radius: 2px; }
        .strength-bar { height: 100%; width: 0%; transition: 0.4s; border-radius: 2px; }
        .strength-text { font-size: 11px; font-weight: bold; margin-top: 4px; }

        /* Error */
        .error-msg { color: #dc3545; font-size: 12px; margin-top: 5px; display: none; }
        .form-group.error input { border-color: #dc3545; }
        .form-group.error .error-msg { display: block; }

        button { 
            width: 100%; padding: 12px; background: #007bff; color: white; border: none; 
            border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px;
        }
        button:hover { background: #0056b3; }
        
        #success-box { display: none; text-align: center; padding: 40px; }
    </style>
</head>
<body>

    <div class="container" id="formBox">
        <h2>Đăng Ký Hệ Thống</h2>
        <form id="regForm" novalidate>
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nhập ít nhất 3 ký tự" maxlength="50">
                <div class="char-count" id="nameCount">0/50</div>
                <span class="error-msg">Họ tên không hợp lệ</span>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="name@domain.com">
                <span class="error-msg">Email không đúng định dạng</span>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Mạnh: Chữ hoa, số, ký hiệu">
                    <span class="toggle-password" id="togglePass">👁️</span>
                </div>
                <div class="strength-meter"><div id="strengthBar" class="strength-bar"></div></div>
                <div id="strengthText" class="strength-text"></div>
                <span class="error-msg">Mật khẩu chưa đủ yêu cầu</span>
            </div>

            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword">
                <span class="error-msg">Mật khẩu xác nhận không khớp</span>
            </div>

            <button type="submit">Đăng Ký Ngay</button>
        </form>
    </div>

    <div class="container" id="success-box">
        <h2 style="color: #28a745;">Thành Công! 🎉</h2>
        <p id="welcomeMsg"></p>
        <button onclick="location.reload()">Quay lại</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
