<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Đặt Hàng Nâng Cao</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 450px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .error-msg { color: #d93025; font-size: 13px; margin-top: 5px; display: none; }
        .form-group.error input, .form-group.error select { border-color: #d93025; }
        .form-group.error .error-msg { display: block; }
        
        /* Đếm ký tự và Tổng tiền */
        .char-count { text-align: right; font-size: 12px; color: #666; }
        .char-count.limit { color: red; font-weight: bold; }
        .total-price { background: #e7f3ff; padding: 10px; border-radius: 5px; font-size: 18px; color: #007bff; font-weight: bold; margin-bottom: 15px; }

        /* Modal xác nhận */
        #confirm-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 350px; }
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-confirm { background: #28a745; color: white; flex: 1; border: none; padding: 10px; cursor: pointer; border-radius: 4px; }
        .btn-cancel { background: #6c757d; color: white; flex: 1; border: none; padding: 10px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h2>🛒 Đặt Hàng Trực Tuyến</h2>
        
        <form id="orderForm" novalidate>
            <div class="form-group">
                <label>Sản phẩm</label>
                <select id="product">
                    <option value="">-- Chọn sản phẩm --</option>
                    <option value="Laptop">Laptop (20.000.000đ)</option>
                    <option value="Điện thoại">Điện thoại (10.000.000đ)</option>
                    <option value="Tai nghe">Tai nghe (500.000đ)</option>
                </select>
                <span class="error-msg">Vui lòng chọn một sản phẩm</span>
            </div>

            <div class="form-group">
                <label>Số lượng (1-99)</label>
                <input type="number" id="quantity" value="1" min="1" max="99">
                <span class="error-msg">Số lượng từ 1 đến 99</span>
            </div>

            <div class="total-price">
                Tổng tiền: <span id="displayTotal">0đ</span>
            </div>

            <div class="form-group">
                <label>Ngày giao hàng</label>
                <input type="date" id="deliveryDate">
                <span class="error-msg">Ngày giao không hợp lệ (trong vòng 30 ngày tới)</span>
            </div>

            <div class="form-group">
                <label>Địa chỉ giao hàng</label>
                <input type="text" id="address" placeholder="Ít nhất 10 ký tự">
                <span class="error-msg">Địa chỉ quá ngắn</span>
            </div>

            <div class="form-group">
                <label>Ghi chú</label>
                <textarea id="note" rows="3" placeholder="Nhập yêu cầu đặc biệt..."></textarea>
                <div class="char-count" id="noteCount">0/200</div>
                <span class="error-msg">Ghi chú không quá 200 ký tự</span>
            </div>

            <div class="form-group" id="payment-area">
                <label>Thanh toán:</label>
                <input type="radio" name="payment" value="COD"> COD
                <input type="radio" name="payment" value="Chuyển khoản"> Chuyển khoản
                <input type="radio" name="payment" value="Ví điện tử"> Ví điện tử
                <div class="error-msg">Vui lòng chọn phương thức thanh toán</div>
            </div>

            <button type="submit" style="background:#007bff; color:white; width:100%; border:none; padding:12px; border-radius:5px; cursor:pointer;">Đặt Hàng Ngay</button>
        </form>
    </div>

    <div id="confirm-modal">
        <div class="modal-content">
            <h3>Xác nhận đơn hàng?</h3>
            <div id="summaryText"></div>
            <div class="modal-btns">
                <button class="btn-confirm" id="btnFinal">Xác nhận</button>
                <button class="btn-cancel" id="btnCancel">Hủy</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
